name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # Stable Ubuntu runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Set up Java (Critical for compiling the Android Gradle project)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Set up Python 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install build dependencies and Buildozer
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip colordiff autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      # 4. Run Buildozer with automated license acceptance
      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      # 5. Upload your finished APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2PMessenger-APK
          path: bin/*.apk
